# Clone OS: toque para clicar no touchpad, como no Windows (sessão X11 de reserva;
# na sessão Wayland quem liga é o cloneos-firstrun).
Section "InputClass"
    Identifier "Clone OS touchpad"
    MatchIsTouchpad "on"
    MatchDriver "libinput"
    Option "Tapping" "on"
    Option "DisableWhileTyping" "on"
EndSection
