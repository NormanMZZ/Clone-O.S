# Clone OS: memória e disco ajustados para 8 GB de RAM com HD.

# A swap é zram (comprimida na própria RAM), muito mais rápida que o HD:
# o kernel pode usá-la à vontade. Valores da documentação do kernel e da
# wiki do Arch para zram.
vm.swappiness = 180
vm.watermark_boost_factor = 0
vm.watermark_scale_factor = 125
vm.page-cluster = 0

# Mantém em memória a estrutura de pastas e arquivos: cada consulta que
# não vai ao HD é uma busca de cabeça de leitura a menos.
vm.vfs_cache_pressure = 50

# Grava no disco em lotes menores e mais frequentes, para o HD não travar
# o sistema ao descarregar de uma vez gigabytes acumulados na memória.
vm.dirty_bytes = 268435456
vm.dirty_background_bytes = 67108864
