# Clone OS: privacidade na rede, como os "endereços de hardware aleatórios" do Windows 11.
# Cada rede Wi-Fi vê um endereço MAC diferente (sempre o mesmo para aquela rede), o que
# impede rastrear o notebook de uma rede para outra. O IPv6 usa endereços temporários.
[connection]
wifi.cloned-mac-address=stable
ipv6.ip6-privacy=2

[device]
wifi.scan-rand-mac-address=yes
